[project]
name = "shift-left-cli"
version = "0.1.0"
description = "Operator CLI for install, update, and offline bundles"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.2",
    "huggingface_hub>=0.28.0",
    "certifi>=2024.0.0",
    "pynacl>=1.5.0",
]

[project.scripts]
shift-left = "shift_left_cli.main:main"

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["shift_left_cli*"]
