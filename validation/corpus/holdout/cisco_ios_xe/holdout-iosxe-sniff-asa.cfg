! Declared cisco_ios_xe but ASA interface/nameif/access-list markers dominate
version 16.12
boot-start-marker
boot-end-marker
hostname FW-SNIFF-ASA
!
interface GigabitEthernet0/0
 nameif outside
 security-level 0
 ip address 203.0.113.1 255.255.255.0
!
access-list OUTSIDE_IN extended permit ip any any
!
