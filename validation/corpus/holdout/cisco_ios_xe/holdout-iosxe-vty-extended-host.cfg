! Holdout IOS-008: extended ACL permits explicit public host on VTY
version 16.12
boot-start-marker
boot-end-marker
hostname holdout-iosxe-vty-ext
!
ip access-list extended MGMT-FROM-INET
 10 permit tcp host 198.51.100.50 any eq 22
 20 deny ip any any
!
line vty 0 4
 access-class MGMT-FROM-INET in
 transport input ssh
 login local
!
