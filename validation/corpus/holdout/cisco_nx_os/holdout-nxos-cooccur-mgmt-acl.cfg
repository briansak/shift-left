! Holdout: management VRF ACL permits any/any (co-occurring violations)
boot nxos
switchname holdout-cooccur-ma
feature ssh
no feature telnet
!
vrf context management
 ip route 0.0.0.0/0 10.88.0.1
!
ip access-list MGMT-IN
 10 permit ip any any
!
line vty
 access-class MGMT-IN in
 transport input ssh
!
aaa authentication login default group radius
!
snmp-server community netsnmp-ro-66bb RO
!
