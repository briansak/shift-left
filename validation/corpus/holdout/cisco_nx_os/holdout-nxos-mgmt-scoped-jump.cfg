! Holdout clean bait: management VRF with RFC1918-only VTY access-class
boot nxos
switchname holdout-mgmt-jump
feature ssh
no feature telnet
!
vrf context management
 ip route 0.0.0.0/0 10.99.0.1
 interface Ethernet1/45
!
ip access-list MGMT-JUMP
 10 permit ip 10.99.10.0/24 any
 20 deny ip any any
!
line vty
 access-class MGMT-JUMP in
 transport input ssh
!
aaa authentication login default group radius
!
snmp-server community netsnmp-ro-3d77 RO
!
