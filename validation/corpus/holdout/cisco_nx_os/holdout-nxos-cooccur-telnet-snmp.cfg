! Holdout: telnet feature plus weak SNMP community (co-occurring violations)
boot nxos
switchname holdout-cooccur-ts
feature ssh
feature telnet
!
vrf context management
!
snmp-server community public RO
snmp-server location DC2-ROW3
!
line vty
 transport input telnet ssh
!
aaa authentication login default group radius
!
