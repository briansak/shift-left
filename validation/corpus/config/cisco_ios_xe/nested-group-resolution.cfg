! IOS-XE nested object-group resolution fixture
version 16.12
hostname branch-sw01
!
object-group network INTERNAL_HOSTS
 network-object 10.0.0.0 0.0.255.255
!
object-group network WEB_SERVERS
 network-object host 10.1.1.10
 group-object INTERNAL_HOSTS
!
ip access-list extended ALLOW-HTTPS
 10 permit tcp any object-group WEB_SERVERS eq 443
!
