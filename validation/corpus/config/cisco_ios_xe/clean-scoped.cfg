! IOS-XE clean scoped config fixture
version 16.12
hostname edge-switch
service timestamps debug datetime msec localtime show-timezone
service timestamps log datetime msec localtime show-timezone
!
interface GigabitEthernet1/0/1
 switchport mode access
 switchport access vlan 100
 no shutdown
!
line vty 0 4
 transport input ssh
!
aaa new-model
aaa authentication login default local
!
snmp-server community nms-ro-44a1 RO
!
ip ssh version 2
!
object-group network DMZ
 network-object 172.16.10.0 0.0.0.255
!
ip access-list extended OUT-ACL
 10 permit tcp 192.168.1.0 0.0.0.255 host 172.16.10.5 eq 443
!
access-list 10 permit 192.168.0.0 0.0.255.255
!
