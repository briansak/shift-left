! NX-OS nested object-group resolution fixture
boot nxos
switchname nested-leaf-01
feature ssh
!
object-group ip address INTERNAL_NETS
 10 ip 10.0.0.0/24
!
object-group ip address WEB_SERVERS
 10 host 10.1.1.10
 20 group-object INTERNAL_NETS
!
ip access-list ALLOW-HTTPS
 10 permit tcp any eq 443 addr group WEB_SERVERS
!
