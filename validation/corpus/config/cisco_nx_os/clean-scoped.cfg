! NX-OS clean scoped config fixture
boot nxos
switchname dc-leaf-01
feature ssh
no feature telnet
no feature scp-server
!
vrf context management
 ip route 0.0.0.0/0 10.10.10.1
 interface Ethernet1/45
!
role name netops
 rule 1 permit command show *
 rule 2 deny command configure terminal
!
interface Ethernet1/1
 no shutdown
!
line vty
 transport input ssh
!
aaa authentication login default group radius
!
snmp-server community ops-read RO
!
object-group ip address DMZ_NETS
 10 ip 172.16.10.0/24
!
object-group ip port WEB_PORTS
 10 eq 443
!
ip access-list ALLOW-HTTPS
 10 permit tcp any eq 443 addr group DMZ_NETS
!
