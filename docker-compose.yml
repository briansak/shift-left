# Shift-Left Review Pipeline — Phase 1 Compose stack
#
# Egress model:
#   - sovereign_internal: internal=true → no internet egress for pipeline services
#   - edge: host-facing ports only (Forgejo UI, orchestrator health)
#   - forgejo + postgres on sovereign_internal + edge
#   - orchestrator + antares-server: sovereign_internal only
#
# Apple Silicon: run antares-server natively on host for MPS (see README).
#   Set ANTARES_HOST_URL=http://host.docker.internal:8090 in .env

name: shift-left

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: forgejo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forgejo-dev-only}
      POSTGRES_DB: forgejo
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - sovereign_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgejo -d forgejo"]
      interval: 10s
      timeout: 5s
      retries: 5

  forgejo:
    image: codeberg.org/forgejo/forgejo:11-rootless
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      USER_UID: ${FORGEJO_USER_UID:-1000}
      USER_GID: ${FORGEJO_USER_GID:-1000}
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: postgres:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: forgejo
      FORGEJO__database__PASSWD: ${POSTGRES_PASSWORD:-forgejo-dev-only}
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__security__SECRET_KEY: ${FORGEJO_SECRET_KEY:-shift-left-dev-secret-change-in-production}
      FORGEJO__security__INTERNAL_TOKEN: ${FORGEJO_INTERNAL_TOKEN:-shift-left-internal-token-change-in-production}
      FORGEJO__oauth2__JWT_SECRET: ${FORGEJO_JWT_SECRET:-shift-left-jwt-secret-change-in-production}
      FORGEJO__server__ROOT_URL: ${FORGEJO_ROOT_URL:-http://localhost:3000}
      FORGEJO__server__HTTP_PORT: 3000
      FORGEJO__actions__ENABLED: "true"
      FORGEJO__log__LEVEL: Info
    volumes:
      - ./data/forgejo:/var/lib/gitea
    ports:
      - "${FORGEJO_PORT:-3000}:3000"
      - "${FORGEJO_SSH_PORT:-2222}:2222"
    networks:
      - sovereign_internal
      - edge

  forgejo-runner:
    build:
      context: docker/forgejo-runner
    image: shift-left-forgejo-runner:latest
    restart: unless-stopped
    depends_on:
      - forgejo
    # Job steps need curl; host-mode avoids per-job docker.sock pulls.
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - ./data/forgejo-runner:/data
      - ./config/forgejo-runner/config.yaml:/data/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - sovereign_internal
      - edge
    # Register once: docker compose run --rm forgejo-runner forgejo-runner register
    # TODO: verify runner version compatibility with Forgejo 11.x in your environment
    command:
      - forgejo-runner
      - daemon
      - --config
      - /data/config.yaml

  # Built locally for Forgejo Actions jobs (curl + sovereign_internal network).
  ci-job-image:
    build:
      context: docker/ci-job
    image: shift-left-ci-job:latest
    profiles:
      - ci-image-only

  orchestrator:
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      forgejo:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SHIFT_LEFT_CONFIG: /config/shift-left.yaml
      FORGEJO_TOKEN: ${FORGEJO_TOKEN:-}
      # Apple Silicon: model servers run host-native; reach via host.docker.internal.
      ANTARES_SERVICE_URL: ${ANTARES_SERVICE_URL:-http://host.docker.internal:8090}
      FOUNDATION_SEC_SERVICE_URL: ${FOUNDATION_SEC_SERVICE_URL:-http://host.docker.internal:8091}
      SHIFT_LEFT_MODEL_HOSTING: ${SHIFT_LEFT_MODEL_HOSTING:-host-native-macos}
      SHIFT_LEFT_SKIP_EGRESS_PROBE: ${SHIFT_LEFT_SKIP_EGRESS_PROBE:-}
      REFERENCE_DATA_CACHE_DIR: /data/reference
      SHIFT_LEFT_REFERENCE_CACHE: /data/reference
      ALLOW_NON_LOOPBACK_UI: "true"
      # In-container repo root for Compose lifecycle (host path is not visible inside the container).
      SHIFT_LEFT_REPO_ROOT: /shift-left
      # Dedicated RW volumes for data/* (the repo bind-mount is :ro).
      SHIFT_LEFT_DATA_DIR: /data
      # Host-native Antares reads repo trees from the Mac path; auto-detected from /shift-left when unset.
      SHIFT_LEFT_HOST_REPO_ROOT: ${SHIFT_LEFT_HOST_REPO_ROOT:-}
      COMPOSE_FILE: /shift-left/docker-compose.yml
    volumes:
      - .:/shift-left:ro
      - ./config/shift-left.yaml:/config/shift-left.yaml
      - ./data/findings:/data/findings
      - ./data/reference:/data/reference:ro
      - ./data/repos:/data/repos
      - ./data/forgejo-runner/.runner:/var/lib/shift-left/forgejo-runner.registered:ro
      # Mount live source at both import locations (editable /app + stale site-packages copy in image).
      - ./services/orchestrator/shift_left:/app/shift_left:ro
      - ./services/orchestrator/shift_left:/usr/local/lib/python3.12/site-packages/shift_left:ro
      - ./services/shift-left-shared/shift_left_shared:/usr/local/lib/python3.12/site-packages/shift_left_shared:ro
      # Privilege escalation: orchestrator controls Compose peers via host Docker API.
      # Grants effective host control — limited to fixed named service actions only.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${ORCHESTRATOR_PORT:-8080}:8080"
    networks:
      - sovereign_internal
      - edge
    # edge: host port publish (Colima/Docker); sovereign_internal: no internet egress
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  antares-server:
    profiles:
      - linux-gpu
      - linux-cpu
    build:
      context: .
      dockerfile: services/antares-server/Dockerfile
    restart: unless-stopped
    environment:
      ALLOW_NON_LOOPBACK_BIND: "true"
      ANTARES_BIND_HOST: 0.0.0.0
      ANTARES_MODEL_PATH: /models/antares
      ANTARES_BACKEND: ${ANTARES_BACKEND:-auto}
      ANTARES_LOAD_STRATEGY: on_demand
    volumes:
      - ${ANTARES_MODEL_HOST_PATH:-./models/1b}:/models/antares:ro
    networks:
      - sovereign_internal
    # Not published to host by default — orchestrator calls internally
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  foundation-sec-server:
    profiles:
      - linux-cpu
    build:
      context: .
      dockerfile: services/foundation-sec-server/Dockerfile
    restart: unless-stopped
    environment:
      ALLOW_NON_LOOPBACK_BIND: "true"
      FOUNDATION_SEC_BIND_HOST: 0.0.0.0
      FOUNDATION_SEC_MODEL_PATH: /models/foundation-sec
      FOUNDATION_SEC_GGUF_GLOB: ${FOUNDATION_SEC_GGUF_GLOB:-*.gguf}
      FOUNDATION_SEC_QUANT_LABEL: ${FOUNDATION_SEC_QUANT_LABEL:-default}
      FOUNDATION_SEC_LOW_MEMORY: ${FOUNDATION_SEC_LOW_MEMORY:-false}
      FOUNDATION_SEC_LOW_MEMORY_GGUF_GLOB: ${FOUNDATION_SEC_LOW_MEMORY_GGUF_GLOB:-}
      FOUNDATION_SEC_LOW_MEMORY_QUANT_LABEL: ${FOUNDATION_SEC_LOW_MEMORY_QUANT_LABEL:-low-memory}
      FOUNDATION_SEC_LOAD_STRATEGY: on_demand
      FOUNDATION_SEC_N_CTX: ${FOUNDATION_SEC_N_CTX:-8192}
      FOUNDATION_SEC_CHUNK_OVERLAP: ${FOUNDATION_SEC_CHUNK_OVERLAP:-2}
      # Set FOUNDATION_SEC_ENGINE=scripted for deterministic CI/tests only
      FOUNDATION_SEC_ENGINE: ${FOUNDATION_SEC_ENGINE:-}
    volumes:
      - ${FOUNDATION_SEC_MODEL_HOST_PATH:-./models/foundation-sec-q8_0}:/models/foundation-sec:ro
    networks:
      - sovereign_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  sovereign_internal:
    driver: bridge
    internal: true
  edge:
    driver: bridge
