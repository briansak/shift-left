[project]
name = "shift-left-antares-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "torch>=2.4.0",
    "transformers>=4.46.0",
    "accelerate>=1.1.0",
    "shift-left-shared",
]

[project.scripts]
antares-server = "antares_server.main:main"

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["antares_server*"]
