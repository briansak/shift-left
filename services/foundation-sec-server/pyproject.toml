[project]
name = "shift-left-foundation-sec-server"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "llama-cpp-python>=0.3.0",
    "python-hcl2>=4.3.0",
    "shift-left-shared",
    "shift-left-orchestrator",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
foundation-sec-server = "foundation_sec_server.main:main"

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["foundation_sec_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
