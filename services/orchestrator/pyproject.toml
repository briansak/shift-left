[project]
name = "shift-left-orchestrator"
version = "0.1.0"
description = "Sovereign shift-left review orchestrator"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
    "pyyaml>=6.0.2",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "unidiff>=0.7.5",
    "python-multipart>=0.0.12",
    "ruamel.yaml>=0.18.0",
    "python-hcl2>=4.3.0",
    "shift-left-shared",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
shift-left-orchestrator = "shift_left.main:main"

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["shift_left*"]

[tool.setuptools.package-data]
shift_left = [
    "ui/static/**",
    "ui/templates/**",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
